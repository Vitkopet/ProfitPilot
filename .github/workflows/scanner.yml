name: AICH Acceleration test
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    paths:
      - 'acceleration.py'
      - 'test_acceleration.py'
      - '.github/workflows/scanner.yml'
permissions:
  contents: read
concurrency:
  group: acceleration-observation
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v
      - name: Scan public markets
        run: python acceleration.py --limit 50
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
