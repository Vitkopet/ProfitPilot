name: AICH Acceleration test
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    paths:
      - 'acceleration.py'
      - 'test_acceleration.py'
      - '.github/workflows/scanner.yml'
      - 'drive_upload.py'
      - 'test_drive_upload.py'
permissions:
  contents: read
concurrency:
  group: acceleration-observation
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v
      - name: Scan public markets
        run: python acceleration.py --limit 50
      - name: Archive report to Google Drive
        if: ${{ always() && hashFiles('reports/latest.json') != '' }}
        env:
          GOOGLE_DRIVE_AUTH_JSON: ${{ secrets.GOOGLE_DRIVE_AUTH_JSON }}
        run: python drive_upload.py
      - name: Show Drive archive status
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('reports/drive_status.json')
          status = json.loads(path.read_text())['status'] if path.exists() else 'NO_UPLOAD_ATTEMPT'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Google Drive archive\n\nStatus: **' + status + '**\n')
          PY
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
